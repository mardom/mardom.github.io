<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="Deep Cosmic Observatory Emblem">
  <defs>
    <radialGradient id="skyGlow" cx="50%" cy="46%" r="54%">
      <stop offset="0%" stop-color="#132552" />
      <stop offset="55%" stop-color="#091026" />
      <stop offset="100%" stop-color="#040712" />
    </radialGradient>
    <linearGradient id="rubinArc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d4ff" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.15" />
    </linearGradient>
    <linearGradient id="goldArc" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f5a623" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.2" />
    </linearGradient>
    <radialGradient id="coreHalo" cx="50%" cy="45%" r="28%">
      <stop offset="0%" stop-color="#00d4ff" stop-opacity="0.45" />
      <stop offset="60%" stop-color="#a855f7" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#040712" stop-opacity="0" />
    </radialGradient>
    <clipPath id="circleClip">
      <circle cx="200" cy="200" r="192" />
    </clipPath>
  </defs>

  <g clip-path="url(#circleClip)">
    <rect width="400" height="400" fill="url(#skyGlow)" />
    <circle cx="200" cy="180" r="130" fill="url(#coreHalo)" />

    <!-- Celestial coordinate grid -->
    <g stroke="#00d4ff" stroke-opacity="0.14" fill="none" stroke-width="1">
      <circle cx="200" cy="200" r="68" />
      <circle cx="200" cy="200" r="118" stroke-dasharray="4 6" />
      <circle cx="200" cy="200" r="164" />
      <line x1="200" y1="16" x2="200" y2="384" stroke-dasharray="3 6" />
      <line x1="16" y1="200" x2="384" y2="200" stroke-dasharray="3 6" />
    </g>

    <!-- Gravitational lensing / subhalo wake arcs -->
    <path d="M 65 155 Q 200 45 335 160" fill="none" stroke="url(#rubinArc)" stroke-width="2.5" stroke-linecap="round" />
    <path d="M 80 235 Q 200 105 320 225" fill="none" stroke="url(#goldArc)" stroke-width="2" stroke-linecap="round" />
    <path d="M 110 120 Q 200 225 295 115" fill="none" stroke="#a855f7" stroke-opacity="0.45" stroke-width="1.5" stroke-dasharray="5 5" />

    <!-- Southern Cross (Crux) & halo starfield -->
    <g stroke="#e2e8f0" stroke-opacity="0.25" stroke-width="1">
      <line x1="200" y1="78" x2="200" y2="146" />
      <line x1="166" y1="108" x2="236" y2="114" />
    </g>
    <g fill="#f8fafc">
      <circle cx="200" cy="78" r="3.2" fill="#00d4ff" />
      <circle cx="200" cy="146" r="2.8" fill="#f5a623" />
      <circle cx="166" cy="108" r="2.4" />
      <circle cx="236" cy="114" r="2.4" />
      <circle cx="222" cy="129" r="1.6" fill="#00d4ff" />
      <circle cx="96" cy="92" r="1.5" opacity="0.8" />
      <circle cx="305" cy="86" r="1.8" fill="#f5a623" opacity="0.9" />
      <circle cx="122" cy="186" r="1.4" opacity="0.7" />
      <circle cx="282" cy="176" r="1.5" opacity="0.8" />
      <circle cx="72" cy="216" r="1.3" opacity="0.6" />
      <circle cx="326" cy="214" r="1.4" opacity="0.65" />
      <circle cx="144" cy="64" r="1.2" opacity="0.6" />
      <circle cx="264" cy="58" r="1.2" opacity="0.6" />
    </g>

    <!-- Stylized Observatory Dome & Mountain Ridge -->
    <path d="M 20 330 L 105 282 L 160 296 L 245 276 L 315 296 L 385 330 L 385 400 L 20 400 Z" fill="#060b18" stroke="#1e293b" stroke-width="1.5" />
    <!-- Telescope beam -->
    <polygon points="204,242 292,76 322,94 214,248" fill="#00d4ff" fill-opacity="0.10" />
    <!-- Observatory dome -->
    <path d="M 156 292 L 156 266 C 156 238 176 220 200 220 C 224 220 244 238 244 266 L 244 292 Z" fill="#0e1a36" stroke="#00d4ff" stroke-width="2" />
    <path d="M 196 221 L 216 252 L 204 256 L 188 224 Z" fill="#f5a623" opacity="0.85" />
    <rect x="146" y="290" width="108" height="14" rx="3" fill="#132245" stroke="#334155" stroke-width="1" />

    <!-- Monogram & Coordinates -->
    <text x="200" y="346" text-anchor="middle" font-family="'Space Grotesk', system-ui, sans-serif" font-size="22" font-weight="700" letter-spacing="4" fill="#e2e8f0">MDR</text>
    <text x="200" y="366" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9.5" letter-spacing="1.5" fill="#00d4ff" opacity="0.85">31°25'S · 30°14'S</text>
  </g>

  <circle cx="200" cy="200" r="192" fill="none" stroke="url(#rubinArc)" stroke-width="2.5" />
</svg>
